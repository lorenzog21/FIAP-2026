name: CI AgroSmart (DevSecOps)

on:
  push:
    branches: [main, "fase*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualidade:
    name: Qualidade de código (ruff + pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check .
      - name: Testes com cobertura
        run: pytest --cov=. --cov-report=term --cov-report=xml
      - uses: actions/upload-artifact@v4
        with:
          name: cobertura
          path: coverage.xml

  seguranca:
    name: Segurança (bandit + pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: SAST (bandit)
        run: bandit -r . -c pyproject.toml -ll
      - name: Vulnerabilidades em dependências (pip-audit)
        run: pip-audit -r requirements.txt

  container:
    name: Build, execução em container e scan da imagem
    runs-on: ubuntu-latest
    needs: [qualidade, seguranca]
    steps:
      - uses: actions/checkout@v4
      - name: Build da imagem
        run: docker build -t agrosmart:ci-${{ github.sha }} .
      - name: Smoke test - pipeline completo no container
        run: |
          cp -R data /tmp/data && cp -R test /tmp/test
          docker run --rm -v /tmp/data:/app/data -v /tmp/test:/app/test:ro agrosmart:ci-${{ github.sha }} python appleAnalisys.py
          docker run --rm -v /tmp/data:/app/data agrosmart:ci-${{ github.sha }} python scripts/status.py
      - name: Scan da imagem (Trivy)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: agrosmart:ci-${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
