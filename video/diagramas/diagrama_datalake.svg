<svg viewBox="0 0 1140 620" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1140" height="620" fill="#ffffff"/>
  <text x="570" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#1a1a1a">Arquitetura do Data Lake — AgroSmart</text>

  <!-- Sources -->
  <text x="110" y="70" text-anchor="middle" font-size="13" font-weight="700" fill="#2f6b2f">FONTES DE DADOS</text>

  <rect x="20" y="90" width="180" height="60" rx="10" fill="#eef7ee" stroke="#4a8f4a" stroke-width="1.5"/>
  <text x="110" y="112" text-anchor="middle" font-size="12.5" fill="#1a1a1a">Imagens de folhas (.JPG)</text>
  <text x="110" y="130" text-anchor="middle" font-size="11" fill="#555">não estruturado</text>

  <rect x="20" y="170" width="180" height="60" rx="10" fill="#eef7ee" stroke="#4a8f4a" stroke-width="1.5"/>
  <text x="110" y="192" text-anchor="middle" font-size="12.5" fill="#1a1a1a">Sensor solo/clima (.JSON)</text>
  <text x="110" y="210" text-anchor="middle" font-size="11" fill="#555">semiestruturado</text>

  <rect x="20" y="250" width="180" height="60" rx="10" fill="#eef7ee" stroke="#4a8f4a" stroke-width="1.5"/>
  <text x="110" y="272" text-anchor="middle" font-size="12.5" fill="#1a1a1a">Metadados de imagem (.CSV)</text>
  <text x="110" y="290" text-anchor="middle" font-size="11" fill="#555">estruturado</text>

  <path d="M200,120 L235,180" stroke="#555" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M200,200 L235,200" stroke="#555" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M200,280 L235,220" stroke="#555" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <!-- BRONZE -->
  <rect x="240" y="90" width="200" height="220" rx="14" fill="#f5e6d8" stroke="#b8794a" stroke-width="2"/>
  <text x="340" y="118" text-anchor="middle" font-size="15" font-weight="700" fill="#7a4a24">BRONZE</text>
  <text x="340" y="136" text-anchor="middle" font-size="11" fill="#7a4a24">(bruta)</text>
  <text x="255" y="165" font-size="11" fill="#4a3020">• imagens originais</text>
  <text x="255" y="185" font-size="11" fill="#4a3020">• leituras de sensor</text>
  <text x="255" y="205" font-size="11" fill="#4a3020">  (lote com timestamp)</text>
  <text x="255" y="225" font-size="11" fill="#4a3020">• metadados_imagens.csv</text>
  <text x="255" y="250" font-size="10.5" fill="#8a6a4a" font-style="italic">append-only,</text>
  <text x="255" y="266" font-size="10.5" fill="#8a6a4a" font-style="italic">nada é sobrescrito</text>

  <path d="M440,200 L498,200" stroke="#555" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="469" y="182" text-anchor="middle" font-size="9.5" fill="#555">validação +</text>
  <text x="469" y="224" text-anchor="middle" font-size="9.5" fill="#555">extração de</text>
  <text x="469" y="236" text-anchor="middle" font-size="9.5" fill="#555">features</text>

  <!-- SILVER -->
  <rect x="505" y="90" width="200" height="220" rx="14" fill="#eceef0" stroke="#6c757d" stroke-width="2"/>
  <text x="605" y="118" text-anchor="middle" font-size="15" font-weight="700" fill="#3d4247">SILVER</text>
  <text x="605" y="136" text-anchor="middle" font-size="11" fill="#3d4247">(confiável)</text>
  <text x="520" y="165" font-size="11" fill="#33383c">• features_treino.csv</text>
  <text x="520" y="185" font-size="11" fill="#33383c">• features_teste.csv</text>
  <text x="520" y="205" font-size="11" fill="#33383c">  (area_doente_ratio,</text>
  <text x="520" y="222" font-size="11" fill="#33383c">   circularity)</text>
  <text x="520" y="250" font-size="10.5" fill="#6c757d" font-style="italic">imagens ilegíveis</text>
  <text x="520" y="266" font-size="10.5" fill="#6c757d" font-style="italic">descartadas e logadas</text>

  <path d="M705,200 L763,200" stroke="#555" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="734" y="182" text-anchor="middle" font-size="9.5" fill="#555">treino ML +</text>
  <text x="734" y="224" text-anchor="middle" font-size="9.5" fill="#555">IA generativa</text>
  <text x="734" y="236" text-anchor="middle" font-size="9.5" fill="#555">simulada</text>

  <!-- GOLD -->
  <rect x="770" y="90" width="200" height="220" rx="14" fill="#fff3cd" stroke="#d4a017" stroke-width="2"/>
  <text x="870" y="118" text-anchor="middle" font-size="15" font-weight="700" fill="#7a5c00">GOLD</text>
  <text x="870" y="136" text-anchor="middle" font-size="11" fill="#7a5c00">(refinada)</text>
  <text x="785" y="165" font-size="11" fill="#5c4400">• results.json</text>
  <text x="785" y="182" font-size="11" fill="#5c4400">  (diagnóstico + % área +</text>
  <text x="785" y="199" font-size="11" fill="#5c4400">   sensor do talhão)</text>
  <text x="785" y="222" font-size="11" fill="#5c4400">• insights.json</text>
  <text x="785" y="239" font-size="11" fill="#5c4400">  (texto em linguagem</text>
  <text x="785" y="256" font-size="11" fill="#5c4400">   natural)</text>

  <path d="M970,200 L1023,200" stroke="#555" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <!-- CONSUMO -->
  <rect x="1028" y="140" width="100" height="120" rx="10" fill="#e7f1ff" stroke="#4a7fd4" stroke-width="1.5"/>
  <text x="1078" y="164" text-anchor="middle" font-size="11" font-weight="700" fill="#1f4a8a">CONSUMO</text>
  <text x="1078" y="186" text-anchor="middle" font-size="9.5" fill="#33455c">Recomendação</text>
  <text x="1078" y="202" text-anchor="middle" font-size="9.5" fill="#33455c">agronômica</text>
  <text x="1078" y="226" text-anchor="middle" font-size="9.5" fill="#33455c">(equipe /</text>
  <text x="1078" y="242" text-anchor="middle" font-size="9.5" fill="#33455c">dashboard)</text>

  <!-- Legend / maintenance note -->
  <rect x="20" y="360" width="1100" height="230" rx="12" fill="#fafafa" stroke="#dddddd" stroke-width="1.5"/>
  <text x="40" y="392" font-size="14" font-weight="700" fill="#1a1a1a">Estratégia de manutenção e confiabilidade</text>

  <circle cx="46" cy="416" r="4" fill="#b8794a"/>
  <text x="60" y="421" font-size="12" fill="#333">Versionamento: cada ingestão grava um lote novo carimbado com data/hora em Bronze — nunca sobrescreve um lote anterior (append-only).</text>

  <circle cx="46" cy="444" r="4" fill="#b8794a"/>
  <text x="60" y="449" font-size="12" fill="#333">Validação: imagem ilegível é descartada e logada (Silver). Leitura de sensor fora de faixa plausível é sinalizada (flag_anomalia), não descartada — fica disponível para auditoria.</text>

  <circle cx="46" cy="472" r="4" fill="#b8794a"/>
  <text x="60" y="477" font-size="12" fill="#333">Completude: cada lote registra, em ingestion_log.jsonl, quantas leituras e imagens foram catalogadas contra o total esperado, para detectar ingestão incompleta.</text>

  <circle cx="46" cy="500" r="4" fill="#b8794a"/>
  <text x="60" y="505" font-size="12" fill="#333">Rastreabilidade: LATEST_BATCH.txt aponta sempre para o lote mais recente consumido pelas camadas Silver e Gold.</text>

  <text x="40" y="545" font-size="11" fill="#777" font-style="italic">Bronze = dado bruto preservado · Silver = dado limpo/validado · Gold = pronto para consumo (diagnóstico + recomendação)</text>
</svg>
