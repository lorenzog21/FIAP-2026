  <text x="490.0" y="27" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#9aa0ab">appleAnalisys.py -- pipeline completo (Bronze → Silver → Gold → Insights)</text>
  <text x="34" y="92" font-family="Menlo, Consolas, monospace" font-size="13.5" fill="#7fd67f" font-weight="700" xml:space="preserve">$ python appleAnalisys.py</text><text x="34" y="122" font-family="Menlo, Consolas, monospace" font-size="13.5" fill="#d8dce3" font-weight="400" xml:space="preserve">Executando ingestão (camada Bronze)...</text><text x="34" y="152" font-family="Menlo, Consolas, monospace" font-size="13.5" fill="#8ab4f8" font-weight="400" xml:space="preserve">[ingest] lote 20260904T220659: 160 leituras de sensor (12 flagadas para</text><text x="34" y="182" font-family="Menlo, Consolas, monospace" font-size="13.5" fill="#8ab4f8" font-weight="400" xml:space="preserve">         auditoria), 2286/2286 imagens catalogadas.</text><text x="34" y="212" font-family="Menlo, Consolas, monospace" font-size="13.5" fill="#d8dce3" font-weight="400" xml:space="preserve">Extraindo atributos das imagens de treino...</text><text x="34" y="242" font-family="Menlo, Consolas, monospace" font-size="13.5" fill="#d8dce3" font-weight="400" xml:space="preserve">2266 imagens válidas, 0 descartadas (camada Silver).</text><text x="34" y="272" font-family="Menlo, Consolas, monospace" font-size="13.5" fill="#d8dce3" font-weight="400" xml:space="preserve">Treinando o RandomForest...</text><text x="34" y="302" font-family="Menlo, Consolas, monospace" font-size="13.5" fill="#d8dce3" font-weight="400" xml:space="preserve">Analisando imagens de teste e gerando JSON (camada Gold)...</text><text x="34" y="332" font-family="Menlo, Consolas, monospace" font-size="13.5" fill="#d8dce3" font-weight="400" xml:space="preserve">Salvou 20 predições em data/gold/results.json (camada Gold)</text><text x="34" y="362" font-family="Menlo, Consolas, monospace" font-size="13.5" fill="#d8dce3" font-weight="400" xml:space="preserve">Gerando insights com IA generativa simulada...</text><text x="34" y="392" font-family="Menlo, Consolas, monospace" font-size="13.5" fill="#8ab4f8" font-weight="400" xml:space="preserve">[insights] gerou 20 diagnosticos em data/gold/insights.json</text>
