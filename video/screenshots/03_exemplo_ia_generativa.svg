<svg viewBox="0 0 1000 794" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1000" height="794" fill="#ffffff"/>
  <text x="40" y="42" font-size="20" font-weight="700" fill="#1a1a1a">Exemplo de saída -- IA generativa simulada</text>
  <text x="40" y="66" font-size="13" fill="#777">Entrada: diagnóstico do modelo de ML + contexto de sensor do talhão -- Saída: texto de síntese em linguagem natural</text>

  <rect x="30" y="68" width="940" height="354" rx="10" fill="#f5f6f8" stroke="#dde1e6"/>
  <text x="50" y="100" font-family="Menlo, Consolas, monospace" font-size="14" fill="#2d333b">{</text><text x="50" y="122" font-family="Menlo, Consolas, monospace" font-size="14" fill="#2d333b">  "image": "applerot4.JPG",</text><text x="50" y="144" font-family="Menlo, Consolas, monospace" font-size="14" fill="#2d333b">  "predicted_class": "Apple___Black_rot",</text><text x="50" y="166" font-family="Menlo, Consolas, monospace" font-size="14" fill="#2d333b">  "probabilities_ml": {</text><text x="50" y="188" font-family="Menlo, Consolas, monospace" font-size="14" fill="#2d333b">    "Apple___healthy": 0.135,</text><text x="50" y="210" font-family="Menlo, Consolas, monospace" font-size="14" fill="#2d333b">    "Apple___Black_rot": 0.865</text><text x="50" y="232" font-family="Menlo, Consolas, monospace" font-size="14" fill="#2d333b">  },</text><text x="50" y="254" font-family="Menlo, Consolas, monospace" font-size="14" fill="#2d333b">  "real_infected_area_percentage": 22.95,</text><text x="50" y="276" font-family="Menlo, Consolas, monospace" font-size="14" fill="#2d333b">  "sensor_context": {</text><text x="50" y="298" font-family="Menlo, Consolas, monospace" font-size="14" fill="#2d333b">    "talhao_id": "T1",</text><text x="50" y="320" font-family="Menlo, Consolas, monospace" font-size="14" fill="#2d333b">    "temperatura_c": 28.0,</text><text x="50" y="342" font-family="Menlo, Consolas, monospace" font-size="14" fill="#2d333b">    "umidade_ar_pct": 53.1,</text><text x="50" y="364" font-family="Menlo, Consolas, monospace" font-size="14" fill="#2d333b">    "umidade_solo_pct": 65.7</text><text x="50" y="386" font-family="Menlo, Consolas, monospace" font-size="14" fill="#2d333b">  }</text><text x="50" y="408" font-family="Menlo, Consolas, monospace" font-size="14" fill="#2d333b">}</text>

  <rect x="30" y="450" width="940" height="294" rx="10" fill="#fff3cd" stroke="#d4a017" stroke-width="1.5"/>
  <text x="50" y="474" font-size="12" font-weight="700" fill="#7a5c00">TEXTO GERADO</text>
  <text x="50" y="490" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#5c4400">O modelo detectou padroes de coloracao compativeis com</text><text x="50" y="514" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#5c4400">Podridao Negra na folha analisada. A lesao esta</text><text x="50" y="538" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#5c4400">avancando sobre 22.9% da area foliar, em estagio</text><text x="50" y="562" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#5c4400">moderado, com confianca do modelo de 86%. Combinado</text><text x="50" y="586" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#5c4400">com temperatura na faixa favoravel a proliferacao</text><text x="50" y="610" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#5c4400">fungica (28.0 graus C) registrada no talhao T1, o</text><text x="50" y="634" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#5c4400">indice de risco de progressao calculado e 0.27 (escala</text><text x="50" y="658" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#5c4400">0 a 1), indicando risco relativamente controlado no</text><text x="50" y="682" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#5c4400">curto prazo, mas que exige acompanhamento. Recomenda-</text><text x="50" y="706" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#5c4400">se poda sanitaria das partes afetadas e avaliacao de</text><text x="50" y="730" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#5c4400">fungicida preventivo a base de cobre.</text>
</svg>
